<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal OS — Jarvis</title>
<meta name="description" content="Behavioural insights, learning recall, and your daily history.">
<meta name="theme-color" content="#17151d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app-topnav"></div>
<main class="app-shell">
  <header class="topbar" id="app-header"></header>

  <div class="tabs" role="tablist">
    <button class="tab-btn" data-os-tab="insights" role="tab" aria-selected="true">Insights</button>
    <button class="tab-btn" data-os-tab="memory" role="tab" aria-selected="false">Memory</button>
    <button class="tab-btn" data-os-tab="history" role="tab" aria-selected="false">History</button>
  </div>

  <section id="panel-insights" role="tabpanel"></section>
  <section id="panel-memory" role="tabpanel" hidden></section>
  <section id="panel-history" role="tabpanel" hidden></section>
</main>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script src="js/components.js"></script>
<script src="js/daily.js"></script>
<script src="js/os.js"></script>
<script src="js/push.js"></script>
<script src="js/app.js"></script>
</body>
</html>
