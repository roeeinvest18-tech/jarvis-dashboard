<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today — Jarvis</title>
<meta name="description" content="Trading setups, important email, and tasks — one glanceable page.">
<meta name="theme-color" content="#1c1d21">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app-topnav"></div>
<main class="app-shell">
  <header class="topbar" id="app-header"></header>

  <div class="market-header" id="market-header"></div>

  <!-- Silence budget: at most 3 items, ranked across all domains. Sits above
       the zones because its whole job is to answer "what actually needs me"
       before the full lists get a chance to compete for attention. -->
  <section class="zone" id="zone-priority" aria-labelledby="zone-priority-label">
    <h2 class="section-label" id="zone-priority-label">Needs you now</h2>
    <div id="priority-list"></div>
  </section>

  <!-- Zone 1 — Trading -->
  <section class="zone" id="zone-trading" aria-labelledby="zone-trading-label">
    <h2 class="section-label" id="zone-trading-label">Top 10 Today</h2>
    <div id="top10-list"></div>
  </section>

  <!-- Zone 2 — Email -->
  <section class="zone" id="zone-email" aria-labelledby="zone-email-label" hidden>
    <h2 class="section-label" id="zone-email-label">Important Emails</h2>
    <div id="emails-list"></div>
  </section>

  <!-- Zone 3 — Tasks -->
  <section class="zone" id="zone-tasks" aria-labelledby="zone-tasks-label" hidden>
    <div class="section-label-row">
      <h2 class="section-label" id="zone-tasks-label">Tasks</h2>
      <div id="done-badge-mount"></div>
    </div>
    <div id="tasks-list"></div>
  </section>

  <!-- Calendar kept below the spec's three zones: existing working
       functionality the spec didn't ask to remove. -->
  <section class="zone" id="zone-calendar" aria-labelledby="zone-calendar-label" hidden>
    <h2 class="section-label" id="zone-calendar-label">Today's Calendar</h2>
    <div id="calendar-list"></div>
  </section>
  <div id="scope-note"></div>
</main>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script src="js/components.js"></script>
<script src="js/tasks.js"></script>
<script src="js/today.js"></script>
<script src="js/app.js"></script>
</body>
</html>
