<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal OS — Jarvis</title>
<meta name="description" content="Your daily routine, training, insights, learning recall and history.">
<meta name="theme-color" content="#151312">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="shell-main">
  <header id="shell-header">
    <div id="shell-eyebrow"></div>
    <div id="shell-subtabs"></div>
    <div id="shell-title"></div>
  </header>

  <div class="shell-body">
    <section data-shell-panel="today" id="panel-today"></section>
    <section data-shell-panel="training" id="panel-training" hidden></section>
    <section data-shell-panel="insights" id="panel-insights" hidden></section>
    <section data-shell-panel="memory" id="panel-memory" hidden></section>
    <section data-shell-panel="history" id="panel-history" hidden></section>

    <div id="health-strip"></div>
  </div>
</main>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/shell.js"></script>
<script src="js/components.js"></script>
<script src="js/market-calendar.js"></script>
<script src="js/health.js"></script>
<script src="js/account.js"></script>
<script src="js/daily.js"></script>
<script src="js/training-hints.js"></script>
<script src="js/training.js"></script>
<script src="js/daily-today.js"></script>
<script src="js/os.js"></script>
<script src="js/personal-os.js"></script>
<script src="js/push.js"></script>
<script src="js/app.js"></script>
<script>
  // System health at the foot of Personal OS too: the backups it reports
  // protect this area's data.
  DASHBOARD.fetchOne('scan').then(scan => renderHealthStrip(document.getElementById('health-strip'), scan));
</script>
</body>
</html>
