  <text x="992" y="117" fill="#9aa4b5" font-family="monospace" font-size="17" text-anchor="end">Google Security Blog</text>
  <text x="88" y="205" fill="#f1f4f9" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700">Google Workspace Continuous</text>
  <text x="88" y="261" fill="#f1f4f9" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700">Approach to Mitigating Indirect</text>
  <text x="88" y="317" fill="#f1f4f9" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700">Prompt Injections</text>
  <line x1="88" y1="395" x2="992" y2="395" stroke="#283040" stroke-width="2"/>
  <rect x="88" y="453" width="904" height="114" rx="12" fill="#0d1016" stroke="#232a38" stroke-width="1.5"/>
  <text x="118" y="497" fill="#d4a359" font-family="monospace" font-size="22" font-weight="700">01</text>
  <text x="168" y="497" fill="#dce2ec" font-family="system-ui, -apple-system, sans-serif" font-size="24">Indirect prompt injection cannot be permanently</text>
  <text x="168" y="531" fill="#dce2ec" font-family="system-ui, -apple-system, sans-serif" font-size="24">solved once and for all in complex AI applications.</text>
  <rect x="88" y="589" width="904" height="114" rx="12" fill="#0d1016" stroke="#232a38" stroke-width="1.5"/>
  <text x="118" y="633" fill="#d4a359" font-family="monospace" font-size="22" font-weight="700">02</text>
  <text x="168" y="633" fill="#dce2ec" font-family="system-ui, -apple-system, sans-serif" font-size="24">Google combines human red-teaming with automated</text>
  <text x="168" y="667" fill="#dce2ec" font-family="system-ui, -apple-system, sans-serif" font-size="24">machine learning driven frameworks.</text>
  <rect x="88" y="725" width="904" height="114" rx="12" fill="#0d1016" stroke="#232a38" stroke-width="1.5"/>
  <text x="118" y="769" fill="#d4a359" font-family="monospace" font-size="22" font-weight="700">03</text>
  <text x="168" y="769" fill="#dce2ec" font-family="system-ui, -apple-system, sans-serif" font-size="24">Automated frameworks algorithmically generate attack</text>
  <text x="168" y="803" fill="#dce2ec" font-family="system-ui, -apple-system, sans-serif" font-size="24">payloads at scale to map complex attack paths.</text>
