  <text x="193" y="117" fill="#d4a359" font-family="monospace" font-size="17" font-weight="700" text-anchor="middle">CYBER &amp; SOC</text>
  <text x="992" y="117" fill="#9aa4b5" font-family="monospace" font-size="17" text-anchor="end">Cloudflare Blog</text>
  <text x="88" y="205" fill="#f1f4f9" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700">Internet traffic and attacks</text>
  <text x="88" y="261" fill="#f1f4f9" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700">during the 2026 U.S. midterm</text>
  <text x="88" y="317" fill="#f1f4f9" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700">elections</text>
  <line x1="88" y1="395" x2="992" y2="395" stroke="#283040" stroke-width="2"/>
  <rect x="88" y="453" width="904" height="114" rx="12" fill="#0d1016" stroke="#232a38" stroke-width="1.5"/>
  <text x="118" y="497" fill="#d4a359" font-family="monospace" font-size="22" font-weight="700">01</text>
  <text x="168" y="497" fill="#dce2ec" font-family="system-ui, -apple-system, sans-serif" font-size="24">Government election websites faced vulnerability</text>
  <text x="168" y="531" fill="#dce2ec" font-family="system-ui, -apple-system, sans-serif" font-size="24">scanning 180 times more often than DDoS attacks.</text>
  <rect x="88" y="589" width="904" height="114" rx="12" fill="#0d1016" stroke="#232a38" stroke-width="1.5"/>
  <text x="118" y="633" fill="#d4a359" font-family="monospace" font-size="22" font-weight="700">02</text>
  <text x="168" y="633" fill="#dce2ec" font-family="system-ui, -apple-system, sans-serif" font-size="24">Vulnerability exploit attempts scaled from 200,000</text>
  <text x="168" y="667" fill="#dce2ec" font-family="system-ui, -apple-system, sans-serif" font-size="24">per day in January to 2 million per day by October.</text>
  <rect x="88" y="725" width="904" height="114" rx="12" fill="#0d1016" stroke="#232a38" stroke-width="1.5"/>
  <text x="118" y="769" fill="#d4a359" font-family="monospace" font-size="22" font-weight="700">03</text>
  <text x="168" y="769" fill="#dce2ec" font-family="system-ui, -apple-system, sans-serif" font-size="24">On Election Day itself, overall attack volume</text>
  <text x="168" y="803" fill="#dce2ec" font-family="system-ui, -apple-system, sans-serif" font-size="24">plateaued with zero major disruptions.</text>
