<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading — Jarvis</title>
<meta name="description" content="Ranked setups, SMA150 breakout alerts and the full nightly scan.">
<meta name="theme-color" content="#151312">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="shell-main">
  <header id="shell-header">
    <div id="shell-eyebrow"></div>
    <div id="shell-subtabs"></div>
    <div id="shell-title"></div>
  </header>

  <div class="shell-body">
    <!-- The market status bar and the ticker/sector search live here now,
         not on Today: they are trading instruments and had no business
         sitting above the morning routine. -->
    <div id="market-window"></div>
    <div id="market-bar"></div>
    <div id="market-why"></div>
    <div id="trading-search"></div>

    <section data-shell-panel="top10" id="panel-top10"></section>
    <section data-shell-panel="breakouts" id="panel-breakouts" hidden></section>
    <section data-shell-panel="fullscan" id="panel-fullscan" hidden></section>
    <section data-shell-panel="scorecard" id="panel-scorecard" hidden></section>

    <div id="health-strip"></div>
  </div>
</main>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/shell.js"></script>
<script src="js/components.js"></script>
<script src="js/market-calendar.js"></script>
<script src="js/health.js"></script>
<script src="js/trading-logic.js"></script>
<script src="js/trading.js"></script>
<script src="js/push.js"></script>
<script src="js/app.js"></script>
</body>
</html>
